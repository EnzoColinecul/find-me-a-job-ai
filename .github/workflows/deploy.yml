name: Deploy

# Merge to main -> deploy TEST automatically.
# PROD deploys are a separate manual run (Actions tab -> "Deploy Prod" -> Run workflow),
# so no paid GitHub plan / environment protection rule is needed.
# Auth to AWS via OIDC (no stored keys); assumes find-me-a-job-ai_oidc-policy.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-test
  cancel-in-progress: false

permissions:
  id-token: write # required for OIDC
  contents: read

env:
  AWS_REGION: ap-southeast-2
  DEPLOY_ROLE: arn:aws:iam::418862088910:role/find-me-a-job-ai_oidc-policy

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install CDK CLI
        run: npm i -g aws-cdk

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-test

      - name: Install infra deps
        working-directory: infra
        run: uv sync

      - name: CDK deploy TEST
        working-directory: infra
        run: uv run cdk deploy 'Fmaj-Test/*' --require-approval never

      - name: Smoke test
        run: |
          URL="${{ vars.TEST_API_URL }}"
          if [ -z "$URL" ]; then
            echo "TEST_API_URL not set yet — skipping smoke test"; exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
          echo "GET $URL/health -> $code"
          [ "$code" = "200" ]
