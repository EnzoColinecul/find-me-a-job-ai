name: Deploy

# Merge to main -> deploy TEST automatically.
# PROD deploys are a separate manual run (Actions tab -> "Deploy Prod" -> Run workflow),
# so no paid GitHub plan / environment protection rule is needed.
# Auth to AWS via OIDC (no stored keys); assumes find-me-a-job-ai_oidc-policy.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-test
  cancel-in-progress: false

permissions:
  id-token: write # required for OIDC
  contents: read

env:
  AWS_REGION: ap-southeast-2
  DEPLOY_ROLE: arn:aws:iam::418862088910:role/find-me-a-job-ai_oidc-policy

jobs:
  deploy-test:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify checked-out commit
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install CDK CLI
        run: npm i -g aws-cdk

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-test

      - name: Install infra deps
        working-directory: infra
        run: uv sync

      - name: CDK deploy TEST
        working-directory: infra
        run: cdk deploy 'Fmaj-Test/*' --require-approval never

      - name: Smoke test
        env:
          API_URL: ${{ vars.TEST_API_URL }}
        run: |
          test -n "$API_URL" || { echo "::error::TEST_API_URL must be configured"; exit 1; }
          code=$(curl --fail --silent --show-error --max-time 10 -o /dev/null -w "%{http_code}" "${API_URL%/}/health")
          echo "GET ${API_URL%/}/health -> $code"
          [ "$code" = "200" ]
