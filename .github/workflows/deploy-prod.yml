name: Deploy Prod

# Manual only: Actions tab -> "Deploy Prod" -> Run workflow.
# This is the deliberate human gate for production (no paid GitHub plan needed).
# Auth to AWS via OIDC (no stored keys); assumes find-me-a-job-ai_oidc-policy.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deploy'
        required: true
        default: ""
      ref:
        description: "Exact commit SHA that passed CI"
        required: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_REGION: ap-southeast-2
  DEPLOY_ROLE: arn:aws:iam::418862088910:role/find-me-a-job-ai_oidc-policy

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "deploy" ]; then
            echo "::error::Confirmation failed — type 'deploy' to proceed."; exit 1
          fi
      - name: Verify tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_REF: ${{ github.event.inputs.ref }}
        run: |
          if ! echo "$DEPLOY_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Provide a full 40-character commit SHA."; exit 1
          fi
          runs=$(gh run list --workflow ci.yml --commit "$DEPLOY_REF" --event push --branch main --json headSha,conclusion)
          tested=$(echo "$runs" | jq -e --arg sha "$DEPLOY_REF" 'any(.[]; .headSha == $sha and .conclusion == "success")')
          [ "$tested" = "true" ] || { echo "::error::CI has not passed for $DEPLOY_REF"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Verify checked-out commit
        env:
          TESTED_SHA: ${{ github.event.inputs.ref }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install CDK CLI
        run: npm i -g aws-cdk

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-prod

      - name: Install infra deps
        working-directory: infra
        run: uv sync

      - name: CDK deploy PROD
        working-directory: infra
        run: cdk deploy 'Fmaj-Prod/*' --require-approval never

      - name: Smoke test
        env:
          API_URL: ${{ vars.PROD_API_URL }}
        run: |
          test -n "$API_URL" || { echo "::error::PROD_API_URL must be configured"; exit 1; }
          code=$(curl --fail --silent --show-error --max-time 10 -o /dev/null -w "%{http_code}" "${API_URL%/}/health")
          echo "GET ${API_URL%/}/health -> $code"
          [ "$code" = "200" ]
