name: Deploy Prod

# Manual only: Actions tab -> "Deploy Prod" -> Run workflow.
# This is the deliberate human gate for production (no paid GitHub plan needed).
# Auth to AWS via OIDC (no stored keys); assumes find-me-a-job-ai_role.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deploy'
        required: true
        default: ""

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  DEPLOY_ROLE: arn:aws:iam::418862088910:role/find-me-a-job-ai_oidc-policy

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "::error::Confirmation failed — type 'deploy' to proceed."; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install CDK CLI
        run: npm i -g aws-cdk

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-prod

      - name: Install infra deps
        working-directory: infra
        run: uv sync

      - name: CDK deploy PROD
        working-directory: infra
        run: uv run cdk deploy 'Fmaj-Prod/*' --require-approval never

      - name: Smoke test
        run: |
          URL="${{ vars.PROD_API_URL }}"
          if [ -z "$URL" ]; then
            echo "PROD_API_URL not set yet — skipping smoke test"; exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
          echo "GET $URL/health -> $code"
          [ "$code" = "200" ]
