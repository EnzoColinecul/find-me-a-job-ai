# Golden eval set — AU companies with expected outcomes.
#
# `accept` is the SET of opportunity_types counted as correct (ground truth for small
# businesses is fuzzy; big brands are strict). "found_any" = any of
# careers_page/job_listing/contact_email is acceptable (tests that the agent finds
# SOMETHING actionable); use sparingly.
#
# NOTE: labels were seeded 2026-07-31 and can go stale — if a case fails, manually
# re-check the company before blaming the agent, and update the label.

cases:
  # ── Big employers with well-known careers presence (strict) ──
  - name: Merivale
    website: https://merivale.com
    types: [restaurant, bar]
    roles: [chef]
    accept: [careers_page, job_listing]
    note: Large Sydney hospitality group, careers section well established.

  - name: The Grounds of Alexandria
    website: https://thegrounds.com.au
