[project]
name = "fmaj-agent"
version = "0.1.0"
description = "Find-Me-A-Job AI — per-company LLM agent (Bedrock Converse tool loop)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27",
    "pydantic>=2.9",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "respx>=0.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmaj_agent"]
