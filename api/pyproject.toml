[project]
name = "fmaj-api"
version = "0.1.0"
description = "Find-Me-A-Job AI — FastAPI backend (Lambda + Mangum)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "mangum>=0.19",
    "pydantic-settings>=2.6",
    "boto3>=1.35",
    "pyjwt[crypto]>=2.9",
    "python-dotenv>=1.0",
    "fpdf2>=2.8",
    "fmaj-agent",
]

# The API reuses the agent package for role interpretation (one small LLM call).
[tool.uv.sources]
fmaj-agent = { path = "../agent", editable = true }

[dependency-groups]
dev = [
    "uvicorn>=0.32",
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
